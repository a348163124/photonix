name: Feature request
description: Suggest a new capability or improvement.
title: "feat: <short summary>"
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Concrete user scenarios help us decide what to build first.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the user need before the solution. "I have to do X every time and it's slow / hard / impossible."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How might this work? UI sketch, API shape, or just words. Optional.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Anything you have already tried, or other approaches you ruled out.
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Where does this fit?
      options:
        - Editor (mask, prompt, history)
        - Library (import, browsing, batch)
        - Generate (text-to-image)
        - Settings / provider
        - Export
        - Performance / large image handling
        - Privacy / security
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: How blocking is this for you?
      options:
        - Nice to have
        - Significantly improves workflow
        - Blocks daily use
    validations:
      required: false
