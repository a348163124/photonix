<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生成 — AI 图像编辑器</title>
  <style>
    :root {
      --bg: oklch(98% 0.005 250);
      --surface: oklch(100% 0 0);
      --fg: oklch(22% 0.02 240);
      --muted: oklch(50% 0.018 240);
      --border: oklch(90% 0.008 240);
      --accent: oklch(58% 0.16 145);
      --font-display: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
      --font-body: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', 'IBM Plex Mono', ui-monospace, Menlo, monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font-body); background: var(--bg); color: var(--fg); min-height: 100vh; display: flex; }
    .sidebar { width: 220px; background: var(--surface); border-right: 1px solid var(--border); padding: 20px 16px; display: flex; flex-direction: column; }
    .logo { font-family: var(--font-display); font-weight: 600; font-size: 18px; margin-bottom: 32px; display: flex; align-items: center; gap: 10px; }
    .logo-icon { width: 28px; height: 28px; background: var(--accent); border-radius: 6px; }
    .nav { display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .nav-item { padding: 10px 12px; border-radius: 8px; text-decoration: none; color: var(--fg); display: flex; align-items: center; gap: 10px; font-size: 14px; transition: background 0.15s; }
    .nav-item:hover { background: var(--border); }
    .nav-item.active { background: var(--fg); color: var(--surface); }
    .nav-icon { width: 18px; height: 18px; opacity: 0.7; }
    .nav-item.active .nav-icon { opacity: 1; }
    .main { flex: 1; display: flex; flex-direction: column; }
    .header { padding: 16px 24px; background: var(--surface); border-bottom: 1px solid var(--border); }
    .header h1 { font-size: 18px; font-weight: 600; }
    .content { flex: 1; display: flex; padding: 24px; gap: 24px; }
    .generate-main { flex: 1; display: flex; flex-direction: column; gap: 20px; }
    .prompt-section { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    .prompt-label { font-size: 13px; font-weight: 500; margin-bottom: 10px; display: block; }
    .prompt-input { width: 100%; min-height: 120px; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; font-family: var(--font-body); resize: vertical; background: var(--bg); }
    .prompt-input:focus { outline: none; border-color: var(--accent); }
    .prompt-actions { display: flex; gap: 8px; margin-top: 12px; }
    .btn { padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; border: none; display: flex; align-items: center; gap: 6px; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-secondary { background: var(--bg); border: 1px solid var(--border); }
    .settings-panel { width: 280px; display: flex; flex-direction: column; gap: 16px; }
    .setting-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    .setting-title { font-size: 13px; font-weight: 600; margin-bottom: 12px; }
    .aspect-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .aspect-btn { aspect-ratio: 1; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; color: var(--muted); transition: all 0.15s; }
    .aspect-btn.active { border-color: var(--accent); color: var(--accent); }
    .aspect-btn span { font-weight: 600; margin-bottom: 2px; }
    .style-list { display: flex; flex-direction: column; gap: 6px; }
    .style-item { padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); cursor: pointer; font-size: 13px; transition: all 0.15s; }
    .style-item.active { border-color: var(--accent); background: rgba(88, 100, 145, 0.1); }
    .slider-group { margin-bottom: 12px; }
    .slider-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 6px; color: var(--muted); }
    .slider-label span:last-child { font-family: var(--font-mono); }
    input[type="range"] { width: 100%; height: 4px; border-radius: 2px; background: var(--border); -webkit-appearance: none; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); cursor: pointer; }
    .preview-section { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; flex: 1; }
    .preview-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .preview-item { aspect-ratio: 1; background: linear-gradient(135deg, var(--bg) 0%, var(--border) 100%); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; }
    .preview-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .preview-title { font-size: 13px; font-weight: 500; }
    .preview-count { font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="logo"><div class="logo-icon"></div>AI 图像编辑器</div>
    <nav class="nav">
      <a href="library.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        图库
      </a>
      <a href="editor.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg>
        编辑器
      </a>
      <a href="generate.html" class="nav-item active">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.93 4.93l1.41 1.41"/><path d="M17.66 17.66l1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M6.34 17.66l-1.41 1.41"/><path d="M19.07 4.93l-1.41 1.41"/></svg>

      </a>
      <a href="style.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        我的风格
      </a>
      <a href="prompts.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        提示词中心
      </a>
      <a href="settings.html" class="nav-item" style="margin-top: auto;">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        设置
      </a>
    </nav>
  </aside>
  <main class="main">
    <div class="header"><h1>Text to Image</h1></div>
    <div class="content">
      <div class="generate-main">
        <div class="prompt-section">
          <label class="prompt-label">Describe the image you want to create</label>
          <textarea class="prompt-input" placeholder="A serene mountain landscape at golden hour, with a crystal-clear lake reflecting the peaks, photorealistic style with warm tones...">A professional product photography shot of a minimalist ceramic coffee mug on a concrete surface, soft natural lighting from the side, shallow depth of field, neutral color palette</textarea>
          <div class="prompt-actions">
            <button class="btn btn-primary">Generate 4 Images</button>
            <button class="btn btn-secondary">Random Prompt</button>
          </div>
        </div>
        <div class="preview-section">
          <div class="preview-header">
            <span class="preview-title">Generated Images</span>
            <span class="preview-count">0 / 4</span>
          </div>
          <div class="preview-grid">
            <div class="preview-item">Waiting for prompt...</div>
            <div class="preview-item">Waiting for prompt...</div>
            <div class="preview-item">Waiting for prompt...</div>
            <div class="preview-item">Waiting for prompt...</div>
          </div>
        </div>
      </div>
      <aside class="settings-panel">
        <div class="setting-card">
          <div class="setting-title">Aspect Ratio</div>
          <div class="aspect-grid">
            <button class="aspect-btn active"><span>1:1</span>Square</button>
            <button class="aspect-btn"><span>16:9</span>Wide</button>
            <button class="aspect-btn"><span>9:16</span>Tall</button>
            <button class="aspect-btn"><span>4:3</span>Standard</button>
          </div>
        </div>
        <div class="setting-card">
          <div class="setting-title">Style Preset</div>
          <div class="style-list">
            <div class="style-item active">Photorealistic</div>
            <div class="style-item">Digital Art</div>
            <div class="style-item">Oil Painting</div>
            <div class="style-item">Anime / Illustration</div>
            <div class="style-item">3D Render</div>
          </div>
        </div>
        <div class="setting-card">
          <div class="setting-title">Quality</div>
          <div class="slider-group">
            <div class="slider-label"><span>Steps</span><span>50</span></div>
            <input type="range" min="20" max="100" value="50">
          </div>
          <div class="slider-group">
            <div class="slider-label"><span>CFG Scale</span><span>7.0</span></div>
            <input type="range" min="1" max="20" value="7">
          </div>
        </div>
      </aside>
    </div>
  </main>
</body>
</html>
