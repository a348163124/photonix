<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Style - AI Image Editor</title>
  <style>
    :root {
      --bg: oklch(98% 0.005 250);
      --surface: oklch(100% 0 0);
      --fg: oklch(22% 0.02 240);
      --muted: oklch(50% 0.018 240);
      --border: oklch(90% 0.008 240);
      --accent: oklch(58% 0.16 145);
      --font-display: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
      --font-body: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', 'IBM Plex Mono', ui-monospace, Menlo, monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--fg);
      display: flex;
      min-height: 100vh;
    }
    .sidebar {
      width: 220px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 16px;
      display: flex;
      flex-direction: column;
      position: fixed;
      height: 100vh;
    }
    .logo {
      font-weight: 600;
      font-size: 14px;
      padding: 12px;
      margin-bottom: 8px;
      color: var(--fg);
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s;
    }
    .nav-item:hover { background: var(--border); color: var(--fg); }
    .nav-item.active { background: var(--accent); color: white; }
    .nav-icon { width: 18px; height: 18px; opacity: 0.7; }
    .nav-item.active .nav-icon { opacity: 1; }
    .main { margin-left: 220px; flex: 1; padding: 24px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    h1 { font-size: 24px; font-weight: 600; }
    .content { display: grid; grid-template-columns: 1fr 320px; gap: 24px; }
    .style-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
    .style-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s;
    }
    .style-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .style-preview {
      aspect-ratio: 1;
      background: linear-gradient(135deg, var(--border), var(--muted));
      position: relative;
    }
    .style-card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px oklch(58% 0.16 145 / 0.2); }
    .style-info { padding: 12px; }
    .style-name { font-weight: 500; font-size: 14px; margin-bottom: 4px; }
    .style-meta { font-size: 12px; color: var(--muted); }
    .style-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--accent);
      color: white;
      font-size: 10px;
      padding: 4px 8px;
      border-radius: 4px;
    }
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      height: fit-content;
    }
    .panel-title { font-weight: 600; font-size: 14px; margin-bottom: 12px; }
    .create-btn {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 16px;
    }
    .create-btn:hover { opacity: 0.9; }
    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      margin-bottom: 16px;
      cursor: pointer;
    }
    .upload-zone:hover { border-color: var(--accent); }
    .upload-icon { font-size: 32px; margin-bottom: 8px; }
    .form-group { margin-bottom: 12px; }
    .form-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; display: block; }
    .form-input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      background: var(--bg);
    }
    .form-input:focus { outline: none; border-color: var(--accent); }
    textarea.form-input { resize: vertical; min-height: 80px; }
    .slider-row { display: flex; align-items: center; gap: 12px; }
    .slider { flex: 1; -webkit-appearance: none; height: 4px; border-radius: 2px; background: var(--border); }
    .slider-value { font-family: var(--font-mono); font-size: 12px; color: var(--muted); width: 40px; }
  </style>
</head>
<body>
  <nav class="sidebar">
    <div class="logo">AI Image Editor</div>
    <a href="library.html" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      图库
    </a>
    <a href="editor.html" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg>
      编辑器
    </a>
    <a href="generate.html" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.93 4.93l1.41 1.41"/><path d="M17.66 17.66l1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M6.34 17.66l-1.41 1.41"/><path d="M19.07 4.93l-1.41 1.41"/></svg>
      生成
    </a>
    <a href="style.html" class="nav-item active">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      我的风格
    </a>
    <a href="prompts.html" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      提示词中心
    </a>
    <div style="margin-top: auto;">
      <a href="settings.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        设置
      </a>
    </div>
  </nav>

  <main class="main">
    <div class="header">
      <h1>我的风格</h1>
      <div style="font-size: 13px; color: var(--muted);">保存你的风格预设，一键应用</div>
    </div>

    <div class="content">
      <div>
        <div class="style-grid">
          <!-- 预设风格 -->
          <div class="style-card">
            <div class="style-preview" style="background: linear-gradient(135deg, #667eea, #764ba2);"></div>
            <div class="style-info">
              <div class="style-name">赛博朋克</div>
              <div class="style-meta">霓虹色调 · 高对比度</div>
            </div>
          </div>
          <div class="style-card">
            <div class="style-preview" style="background: linear-gradient(135deg, #f093fb, #f5576c);"></div>
            <div class="style-info">
              <div class="style-name">日落暖调</div>
              <div class="style-meta">温暖 · 柔和</div>
            </div>
          </div>
          <div class="style-card selected">
            <div class="style-preview" style="background: linear-gradient(135deg, #4facfe, #00f2fe);"></div>
            <div class="style-badge">当前</div>
            <div class="style-info">
              <div class="style-name">清新蓝调</div>
              <div class="style-meta">清冷 · 明亮</div>
            </div>
          </div>
          <div class="style-card">
            <div class="style-preview" style="background: linear-gradient(135deg, #fa709a, #fee140);"></div>
            <div class="style-info">
              <div class="style-name">糖果色</div>
              <div class="style-meta">活泼 · 鲜艳</div>
            </div>
          </div>
          <div class="style-card">
            <div class="style-preview" style="background: linear-gradient(135deg, #a8edea, #fed6e3);"></div>
            <div class="style-info">
              <div class="style-name">柔和粉彩</div>
              <div class="style-meta">温柔 · 低饱和</div>
            </div>
          </div>
          <div class="style-card">
            <div class="style-preview" style="background: linear-gradient(135deg, #2c3e50, #4ca1af);"></div>
            <div class="style-info">
              <div class="style-name">电影感</div>
              <div class="style-meta">专业 · 深沉</div>
            </div>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">创建新风格</div>
        <button class="create-btn">+ 从参考图创建</button>
        
        <div class="upload-zone">
          <div class="upload-icon">📤</div>
          <div style="font-size: 13px;">拖拽或点击上传参考图</div>
          <div style="font-size: 11px; color: var(--muted); margin-top: 4px;">支持 JPG, PNG, WebP</div>
        </div>

        <div class="form-group">
          <label class="form-label">风格名称</label>
          <input type="text" class="form-input" placeholder="为这个风格命名...">
        </div>

        <div class="form-group">
          <label class="form-label">风格描述 (可选)</label>
          <textarea class="form-input" placeholder="描述这个风格的特点..."></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">风格强度</label>
          <div class="slider-row">
            <input type="range" class="slider" min="0" max="100" value="75">
            <span class="slider-value">75%</span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">色彩保留</label>
          <div class="slider-row">
            <input type="range" class="slider" min="0" max="100" value="50">
            <span class="slider-value">50%</span>
          </div>
        </div>

        <button class="create-btn" style="margin-top: 8px;">保存风格</button>
      </div>
    </div>
  </main>
</body>
</html>
